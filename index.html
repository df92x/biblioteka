<html lang="pl">
<head>
<meta charset="utf-8">

<title>StoryKeep</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%22100%20170%20824%20690%22%3E%3Cpath%20d%3D%22M512%20250%20C420%20190%20290%20175%20150%20205%20L150%20790%20C290%20760%20420%20775%20512%20835%20Z%22%20fill%3D%22%23fff8ec%22%20stroke%3D%22%238b4a2b%22%20stroke-width%3D%2240%22%20stroke-linejoin%3D%22round%22/%3E%3Cpath%20d%3D%22M512%20250%20C604%20190%20734%20175%20874%20205%20L874%20790%20C734%20760%20604%20775%20512%20835%20Z%22%20fill%3D%22%23f3e4cb%22%20stroke%3D%22%238b4a2b%22%20stroke-width%3D%2240%22%20stroke-linejoin%3D%22round%22/%3E%3Cpath%20d%3D%22M512%20250%20L512%20835%22%20stroke%3D%22%238b4a2b%22%20stroke-width%3D%2244%22%20stroke-linecap%3D%22round%22/%3E%3Cg%20stroke%3D%22%23c9a77c%22%20stroke-width%3D%2226%22%20stroke-linecap%3D%22round%22%20fill%3D%22none%22%3E%3Cpath%20d%3D%22M235%20330%20C300%20320%20370%20325%20430%20350%22/%3E%3Cpath%20d%3D%22M235%20430%20C300%20420%20370%20425%20430%20450%22/%3E%3Cpath%20d%3D%22M235%20530%20C300%20520%20370%20525%20430%20550%22/%3E%3Cpath%20d%3D%22M594%20350%20C654%20325%20724%20320%20789%20330%22/%3E%3Cpath%20d%3D%22M594%20450%20C654%20425%20724%20420%20789%20430%22/%3E%3C/g%3E%3Cpath%20d%3D%22M690%20205%20L690%20430%20L735%20390%20L780%20430%20L780%20215%20Z%22%20fill%3D%22%23d98c5f%22%20stroke%3D%22%238b4a2b%22%20stroke-width%3D%2222%22%20stroke-linejoin%3D%22round%22/%3E%3C/svg%3E">
<style>
:root{--bg:#f6f1e9;--card:#fff;--tx:#2b2520;--mut:#8a7f73;--ac:#8b4a2b;--bd:#e4dccf}
@media(prefers-color-scheme:dark){:root{--bg:#1c1917;--card:#292524;--tx:#f0e9df;--mut:#a39a8e;--ac:#d98c5f;--bd:#3d3733}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif}
header{max-width:1000px;margin:0 auto;padding:24px 16px 8px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:1.6rem}
.count{color:var(--mut);font-size:.9rem}
#count{display:none;line-height:1.5;margin-top:2px;font-size:.85rem}#count b{color:var(--tx)}
#count.open{display:block}h1{cursor:pointer;user-select:none}.chev{font-size:.6em;color:var(--mut)}
.hbtns{display:flex;align-items:center;gap:14px}
.addb{width:52px;height:52px;border-radius:50%;padding:0;background:#f08a24;color:#fff;border-color:#f08a24;font-size:2.2rem;font-weight:300;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px #0004}
.gbtn{width:44px;height:44px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center}
.gbtn.on{box-shadow:0 0 0 2px #34A853}
.gp{display:grid;gap:10px}.gp p{margin:0}.gp button{width:100%}
.bar:has(#st:empty){display:none}
.bar{max-width:1000px;margin:0 auto;padding:8px 16px;display:flex;gap:8px;flex-wrap:wrap}
input,select,button{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
button{cursor:pointer}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
#q{flex:1;min-width:140px}
main{--w:160px;max-width:1000px;margin:0 auto;padding:8px 16px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--w),1fr));gap:16px}
main.v-md{--w:110px;gap:12px}main.v-sm{--w:78px;gap:8px}
main.v-sm .info,main.v-md .info{padding:6px;font-size:.8rem}main.v-sm .info{font-size:.7rem}
main.v-sm .acts button,main.v-md .acts button{font-size:.7rem;padding:4px 2px}
main.v-sm .cover{font-size:1.5rem}
main.v-list{display:block}main.v-list .book{flex-direction:row;align-items:center;margin-bottom:8px}
main.v-list .cover{display:none}main.v-list .info{padding:10px 12px}
main.v-list .info small{display:inline}main.v-list .info small+small::before{content:" · "}
main.v-list .acts{border-top:0;border-left:1px solid var(--bd);flex:0 0 auto}main.v-list .acts button{padding:12px 10px}
.gp label{display:flex;gap:8px;align-items:center;color:var(--tx)}.gp h3{margin:6px 0 0;font-size:.95rem;color:var(--mut)}
.book{background:var(--card);border:1px solid var(--bd);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.cover{aspect-ratio:2/3;background:var(--bd);display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:2.5rem;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover}
.info{padding:10px;flex:1}
.info b{display:block}
.info small{color:var(--mut);display:block}
.acts{display:flex;border-top:1px solid var(--bd)}
.acts button{flex:1;border:0;border-radius:0;background:none;font-size:.85rem;color:var(--mut)}
.acts button:hover{color:var(--ac)}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:48px 0}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);width:min(420px,92vw);padding:20px}
dialog::backdrop{background:#0008}
form{display:grid;gap:12px}
label{display:grid;gap:4px;font-size:.9rem;color:var(--mut)}
label input{color:var(--tx)}
.prev{width:90px;aspect-ratio:2/3;object-fit:cover;border-radius:6px;border:1px solid var(--bd);display:none}
.row{display:flex;gap:8px;justify-content:flex-end}
</style>
</head>
<body>
<header><div><h1 id="ttl" role="button" tabindex="0" title="Pokaż statystyki"><svg viewBox="100 170 824 690" width="40" height="34" aria-hidden="true" style="vertical-align:-5px;margin-right:6px"><path d="M512 250 C420 190 290 175 150 205 L150 790 C290 760 420 775 512 835 Z" fill="#fff8ec" stroke="#8b4a2b" stroke-width="40" stroke-linejoin="round"/><path d="M512 250 C604 190 734 175 874 205 L874 790 C734 760 604 775 512 835 Z" fill="#f3e4cb" stroke="#8b4a2b" stroke-width="40" stroke-linejoin="round"/><path d="M512 250 L512 835" stroke="#8b4a2b" stroke-width="44" stroke-linecap="round"/><g stroke="#c9a77c" stroke-width="26" stroke-linecap="round" fill="none"><path d="M235 330 C300 320 370 325 430 350"/><path d="M235 430 C300 420 370 425 430 450"/><path d="M235 530 C300 520 370 525 430 550"/><path d="M594 350 C654 325 724 320 789 330"/><path d="M594 450 C654 425 724 420 789 430"/></g><path d="M690 205 L690 430 L735 390 L780 430 L780 215 Z" fill="#d98c5f" stroke="#8b4a2b" stroke-width="22" stroke-linejoin="round"/></svg>StoryKeep <small class="chev">▾</small></h1><span class="count" id="count"></span></div><div class="hbtns"><button id="gbtn" class="gbtn" title="Zaloguj przez Google" aria-label="Zaloguj przez Google"><svg viewBox="0 0 48 48" width="22" height="22" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.2 5.5-4.7 7.2l7.6 5.9c4.4-4.1 6.9-10.2 6.9-17.6z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg></button><button id="add" class="addb" title="Dodaj książkę" aria-label="Dodaj książkę">+</button></div></header>
<div class="bar"><span class="count" id="st"></span></div>
<div class="bar">
  <input id="q" type="search" placeholder="Szukaj tytułu lub autora…">
  <button id="setb" title="Ustawienia widoku" aria-label="Ustawienia widoku" style="font-size:1.2rem;line-height:1">⚙</button>
</div>
<main id="list"></main>

<dialog id="dlg">
  <form id="f" method="dialog">
    <h2 id="dt" style="margin:0">Nowa książka</h2>
    <label>ISBN (opcjonalnie)<span style="display:flex;gap:6px"><input id="isbn" inputmode="numeric" placeholder="np. 9788324631766" style="flex:1;min-width:0"><button type="button" id="isbnbtn">Szukaj</button><button type="button" id="scanbtn" title="Skanuj kod kreskowy">📷</button></span></label>
    <div id="scanbox" style="display:none"><video id="vid" playsinline muted style="width:100%;border-radius:8px;background:#000"></video><small style="color:var(--mut)">Skieruj aparat na kod kreskowy z tyłu książki (zaczyna się od 978…)</small> <button type="button" id="scanstop">Zamknij aparat</button></div>
    <small id="isbnst" style="color:var(--mut)"></small>
    <label>Tytuł<input id="title" required></label>
    <label>Autor<input id="author"></label>
    <label>Data przeczytania<input id="date" type="date" required></label>
    <label>Okładka (miniaturka)<input id="file" type="file" accept="image/*"></label>
    <img id="prev" class="prev" alt="">
    <div class="row">
      <button type="button" id="cancel">Anuluj</button>
      <button class="pri" type="submit">Zapisz</button>
    </div>
  </form>
</dialog>

<dialog id="sdlg"><div id="sbody" class="gp"></div><div class="row" style="margin-top:12px"><button type="button" id="sclose" class="pri">Gotowe</button></div></dialog>
<dialog id="gdlg"><div id="gbody" class="gp"></div><div class="row" style="margin-top:12px"><button type="button" id="gclose">Zamknij</button></div></dialog>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const KEY='biblioteka.books';
const WORKER='https://orange-rice-5fb6.flinta92.workers.dev/';// adres wlasnego Cloudflare Workera (patrz README), np. https://biblioteka.TWOJ.workers.dev/
function tfetch(u,ms=6000){const c=new AbortController(),id=setTimeout(()=>c.abort(),ms);return fetch(u,{signal:c.signal}).finally(()=>clearTimeout(id))}
async function pfetch(u){
  for(const p of [WORKER&&WORKER+'?url=','https://api.allorigins.win/raw?url=']){
    if(!p)continue;
    try{const x=await tfetch(p+encodeURIComponent(u));if(x.ok)return x}catch(e){}
  }
  throw new Error('proxy');
}
const GBKEY='';// opcjonalny klucz API Google Books (zwieksza limit zapytan)
let books=[];try{books=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
let view_={sort:'date-desc',size:'lg'};try{Object.assign(view_,JSON.parse(localStorage.getItem('biblioteka.view')))}catch(e){}
const live=()=>books.filter(b=>!b.deleted);
let editId=null,cover='';
const $=id=>document.getElementById(id);
const saveLocal=()=>{try{localStorage.setItem(KEY,JSON.stringify(books))}catch(e){alert('Brak miejsca w pamięci przeglądarki — usuń część okładek.')}};
let t;const save=()=>{saveLocal();clearTimeout(t);t=setTimeout(sync,1500)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){
  const q=$('q').value.toLowerCase(),s=view_.sort;$('list').className='v-'+view_.size;
  let l=live().filter(b=>(b.title+' '+b.author).toLowerCase().includes(q));
  l.sort((a,b)=>s==='title'?a.title.localeCompare(b.title,'pl'):s==='title-desc'?b.title.localeCompare(a.title,'pl'):s==='date-asc'?a.date.localeCompare(b.date):b.date.localeCompare(a.date));
  const all=live(),now=new Date(),iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const today=iso(now),wk=iso(new Date(now.getFullYear(),now.getMonth(),now.getDate()-6)),mo=today.slice(0,7),yr=today.slice(0,4);
  $('count').innerHTML=`<b>Przeczytane: ${all.length}</b><br>Ostatnie 7 dni: ${all.filter(b=>b.date>=wk&&b.date<=today).length}<br>W tym miesiącu: ${all.filter(b=>b.date.startsWith(mo)).length}<br>W tym roku: ${all.filter(b=>b.date.startsWith(yr)).length}`;
  $('list').innerHTML=l.length?l.map(b=>`<div class="book">
    <div class="cover">${b.cover?`<img src="${b.cover}" alt="">`:'📖'}</div>
    <div class="info"><b>${esc(b.title)}</b>${b.author?`<small>${esc(b.author)}</small>`:''}<small>${new Date(b.date).toLocaleDateString('pl-PL')}</small></div>
    <div class="acts"><button onclick="edit('${b.id}')">Edytuj</button><button onclick="del('${b.id}')">Usuń</button></div>
  </div>`).join(''):'<div class="empty">Brak książek. Dodaj pierwszą!</div>';
}
function open_(b){
  editId=b?b.id:null;cover=b?b.cover:'';
  $('dt').textContent=b?'Edytuj książkę':'Nowa książka';
  $('title').value=b?b.title:'';$('author').value=b?b.author:'';
  $('date').value=b?b.date:new Date().toISOString().slice(0,10);
  $('file').value='';$('isbn').value='';$('isbnst').textContent='';showPrev();$('dlg').showModal();
}
function showPrev(){$('prev').style.display=cover?'block':'none';$('prev').src=cover}
function edit(id){open_(live().find(b=>b.id===id))}
function del(id){if(confirm('Usunąć tę książkę?')){books=books.map(b=>b.id===id?{id,deleted:true,updated:Date.now()}:b);save();render()}}

function setCoverFromSrc(src){return new Promise(res=>{
  const img=new Image();
  img.onload=()=>{
    const w=300,h=450,c=document.createElement('canvas');c.width=w;c.height=h;
    const x=c.getContext('2d'),r=Math.max(w/img.width,h/img.height),sw=w/r,sh=h/r;
    x.drawImage(img,(img.width-sw)/2,(img.height-sh)/2,sw,sh,0,0,w,h);
    cover=c.toDataURL('image/jpeg',.8);showPrev();res(true)};
  img.onerror=()=>res(false);img.src=src})}
$('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const u=URL.createObjectURL(f);setCoverFromSrc(u).then(()=>URL.revokeObjectURL(u));
};
async function coverFromUrl(url){
  for(const f of [()=>tfetch(url),()=>pfetch(url)]){try{const b=await(await f()).blob();const u=URL.createObjectURL(b);const ok=await setCoverFromSrc(u);URL.revokeObjectURL(u);if(ok)return}catch(e){}}
  cover=url;showPrev();
}
async function isbnLookup(){
  const n=$('isbn').value.replace(/[^0-9Xx]/g,'');const st=$('isbnst');
  if(n.length!==10&&n.length!==13){st.textContent='ISBN ma 10 lub 13 cyfr';return}
  st.textContent='Szukam…';
  let t='',a='',img='',d='';
  try{
    const u='https://www.poczytaj.pl/index.php?akcja=pokaz_ksiazki&szukaj='+n;
    const h=await(await pfetch(u)).text();
    const d=new DOMParser().parseFromString(h,'text/html');
    const row=d.querySelector('.lista_poz');
    if(row&&h.includes('lista_okl')){
      const clean=x=>x.textContent.replace(/\s+/g,' ').trim();
      const ti=row.querySelector('a.tytul'),au=row.querySelector('.autor_lista'),im=d.querySelector('.lista_okl img');
      if(ti){t=clean(ti);a=au?clean(au).replace(/\s+/g,' '):''}
      if(im&&im.getAttribute('src')&&im.getAttribute('src').includes('staticl'))img=im.getAttribute('src').replace('-s.jpg','-l.jpg');
    }
  }catch(e){}
  if(!t)try{
    const g=await(await tfetch('https://www.googleapis.com/books/v1/volumes?q=isbn:'+n+(GBKEY?'&key='+GBKEY:''))).json();
    const v=g.items&&g.items[0]&&g.items[0].volumeInfo;
    if(v){t=v.title+(v.subtitle?': '+v.subtitle:'');a=(v.authors||[]).join(', ');img=v.imageLinks&&(v.imageLinks.thumbnail||v.imageLinks.smallThumbnail)||'';img=img.replace('http://','https://').replace('&edge=curl','').replace('zoom=1','zoom=2')}
  }catch(e){}
  if(!t||!img){
    try{
      const o=await(await tfetch('https://openlibrary.org/api/books?bibkeys=ISBN:'+n+'&format=json&jscmd=data')).json();
      const v=o['ISBN:'+n];
      if(v){t=t||v.title;a=a||(v.authors||[]).map(x=>x.name).join(', ');img=img||(v.cover&&(v.cover.large||v.cover.medium))||''}
    }catch(e){}
  }
  if(!t){
    try{
      const u='https://data.bn.org.pl/api/institutions/bibs.json?limit=1&isbnIssn='+n;
      const j=await(await pfetch(u)).json();
      const v=j.bibs&&j.bibs[0];
      if(v){
        t=v.title.split(' / ')[0].replace(/[\s:;.,\/]+$/,'');
        const f=(v.author||'').split(' (')[0].trim();
        a=f.includes(', ')?f.split(', ').reverse().join(' '):f;
      }
    }catch(e){}
  }
  if(!t){st.textContent='Nie znaleziono książki (lub serwery nie odpowiadają) — wpisz dane ręcznie';return}
  $('title').value=t;$('author').value=a;
  st.textContent=img?'Znaleziono ✓':'Znaleziono (bez okładki — dodaj zdjęcie)';
  if(img)await coverFromUrl(img);
  else if(await setCoverFromSrc('https://covers.openlibrary.org/b/isbn/'+n+'-L.jpg?default=false'))st.textContent='Znaleziono ✓';
}
$('isbnbtn').onclick=isbnLookup;
let stream=null,scanning=false,zxr=null;
function stopScan(){scanning=false;if(zxr){try{zxr.reset()}catch(e){}zxr=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('vid').srcObject=null;$('scanbox').style.display='none'}
function gotCode(v){const n=String(v).replace(/\D/g,'');if(n.length===13&&/^97[89]/.test(n)){stopScan();$('isbn').value=n;isbnLookup();return true}return false}
function loadZX(){return new Promise((ok,no)=>{if(window.ZXing)return ok();const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)})}
async function startScan(){
  const st=$('isbnst');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){st.textContent='Ta przeglądarka nie obsługuje aparatu';return}
  $('scanbox').style.display='block';st.textContent='Uruchamiam aparat…';scanning=true;
  const vc={facingMode:'environment',width:{ideal:1920},height:{ideal:1080}};
  try{
    let native=false;
    if('BarcodeDetector' in window){try{native=(await BarcodeDetector.getSupportedFormats()).includes('ean_13')}catch(e){}}
    if(native){
      const det=new BarcodeDetector({formats:['ean_13']});
      stream=await navigator.mediaDevices.getUserMedia({video:vc});
      const v=$('vid');v.srcObject=stream;await v.play();
      try{await stream.getVideoTracks()[0].applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}
      st.textContent='Szukam kodu… (trzymaj 15–25 cm od kodu, dobre światło)';
      const loop=async()=>{if(!scanning)return;try{const c=await det.detect(v);for(const b of c)if(gotCode(b.rawValue))return}catch(e){}setTimeout(loop,200)};loop();
    }else{
      st.textContent='Ładuję czytnik…';await loadZX();if(!scanning)return;
      const h=new Map();h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13]);h.set(ZXing.DecodeHintType.TRY_HARDER,true);
      zxr=new ZXing.BrowserMultiFormatReader(h,150);
      st.textContent='Szukam kodu… (trzymaj 15–25 cm od kodu, dobre światło)';
      zxr.decodeFromConstraints({video:vc},'vid',res=>{if(res)gotCode(res.getText())});
    }
  }catch(e){stopScan();st.textContent='Błąd aparatu: '+(e.name||e.message)+' — zezwól na aparat w ustawieniach przeglądarki'}
}
$('scanbtn').onclick=startScan;$('scanstop').onclick=()=>{stopScan();$('isbnst').textContent=''};
$('dlg').addEventListener('close',stopScan);
$('isbn').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();isbnLookup()}};
$('f').onsubmit=()=>{
  const d={title:$('title').value.trim(),author:$('author').value.trim(),date:$('date').value,cover,updated:Date.now()};
  if(editId)books=books.map(b=>b.id===editId?{...b,...d}:b);
  else books.push({id:Date.now().toString(36),...d});
  save();render();
};
$('add').onclick=()=>open_();
$('cancel').onclick=()=>$('dlg').close();
const tg=()=>$('count').classList.toggle('open');
$('ttl').onclick=tg;$('ttl').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tg()}};
$('q').oninput=render;
$('setb').onclick=()=>{
  const opt=(n,v,t)=>`<label><input type="radio" name="${n}" value="${v}" ${view_[n]===v?'checked':''}> ${t}</label>`;
  $('sbody').innerHTML='<h3>Sortowanie</h3>'+opt('sort','date-desc','Od najnowszej')+opt('sort','date-asc','Od najstarszej')+opt('sort','title','Tytuł A–Z')+opt('sort','title-desc','Tytuł Z–A')
    +'<h3>Widok</h3>'+opt('size','lg','Duże miniaturki')+opt('size','md','Mniejsze miniaturki')+opt('size','sm','Małe miniaturki')+opt('size','list','Lista bez miniaturek');
  $('sdlg').showModal();
};
$('sdlg').addEventListener('change',e=>{if(e.target.name){view_[e.target.name]=e.target.value;try{localStorage.setItem('biblioteka.view',JSON.stringify(view_))}catch(x){}render()}});
$('sdlg').addEventListener('click',e=>{if(e.target===$('sdlg')||e.target.id==='sclose')$('sdlg').close()});

// ---- Synchronizacja z Google Drive (appDataFolder) ----
const FN='biblioteka.json',SCOPE='https://www.googleapis.com/auth/drive.appdata';
let tok=null,tokExp=0,client=null,fileId=null;
const setG=t=>{const b=$('gbtn');b.title=t;b.setAttribute('aria-label',t);b.classList.toggle('on',t.includes('Zsynchronizuj'))};
const setSt=m=>$('st').textContent=m;
const cid=()=>'566153575236-ehvimnjfblq87227v4qqte2enh3hqvpt.apps.googleusercontent.com';
function merge(a){const m=new Map();[...books,...a].forEach(b=>{const o=m.get(b.id);if(!o||(b.updated||0)>(o.updated||0))m.set(b.id,b)});books=[...m.values()]}
const isNative=()=>!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
const getSL=()=>{const C=window.Capacitor;return (C.Plugins&&C.Plugins.SocialLogin)||(C.registerPlugin&&C.registerPlugin('SocialLogin'))};
async function nativeLogin(sw){
  try{
    const SL=getSL();
    if(!SL){setSt('Brak wtyczki logowania w tej aplikacji');return}
    await SL.initialize({google:{webClientId:cid()}});
    if(sw){try{await SL.logout({provider:'google'})}catch(e){}}
    const r=await SL.login({provider:'google',options:{scopes:['email','profile',SCOPE]}});
    const at=r&&r.result&&r.result.accessToken&&r.result.accessToken.token;
    if(!at){setSt('Logowanie bez dostępu do Dysku — spróbuj ponownie');return}
    tok=at;tokExp=Date.now()+50*60*1000;
    try{const em=r.result.profile&&r.result.profile.email;if(em)localStorage.setItem('biblioteka.email',em)}catch(e){}
    localStorage.setItem('biblioteka.on','1');setG('☁ Zsynchronizuj teraz');afterLogin();
  }catch(e){setSt('Błąd logowania: '+(e.message||e))}
}
function login(sw){
  if(isNative())return nativeLogin(sw);
  if(!window.google){setSt('Ładowanie Google…');return}
  let id=cid();if(!id){id=prompt('Wklej Google OAuth Client ID (instrukcja w README.md):');if(!id)return;localStorage.setItem('biblioteka.cid',id.trim())}
  client=google.accounts.oauth2.initTokenClient({client_id:cid(),scope:SCOPE+' email',callback:r=>{
    if(r.error){setSt('Błąd logowania');return}
    tok=r.access_token;tokExp=Date.now()+(r.expires_in-60)*1000;try{localStorage.setItem('biblioteka.tok',JSON.stringify({t:tok,e:tokExp}))}catch(e){}localStorage.setItem('biblioteka.on','1');setG('☁ Zsynchronizuj teraz');afterLogin()}});
  client.requestAccessToken({prompt:sw?'select_account':(localStorage.getItem('biblioteka.on')?'':'consent')});
}
async function afterLogin(){
  if(!isNative())await fetchEmail();
  const em=localStorage.getItem('biblioteka.email'),owner=localStorage.getItem('biblioteka.owner');
  if(em&&owner&&owner!==em){books=[];saveLocal();render()}
  if(em)localStorage.setItem('biblioteka.owner',em);
  sync();
}
async function fetchEmail(){try{const u=await(await api('https://www.googleapis.com/oauth2/v3/userinfo')).json();if(u.email)localStorage.setItem('biblioteka.email',u.email)}catch(e){}}
async function switchAccount(){
  if(tok&&Date.now()<tokExp){try{await sync()}catch(e){}}
  books=[];saveLocal();render();
  ['biblioteka.email','biblioteka.owner'].forEach(k=>localStorage.removeItem(k));
  tok=null;tokExp=0;login(true);
}
async function logout(){
  try{if(isNative()){const SL=getSL();if(SL){await SL.initialize({google:{webClientId:cid()}});await SL.logout({provider:'google'})}}else if(tok&&window.google)google.accounts.oauth2.revoke(tok)}catch(e){}
  tok=null;tokExp=0;['biblioteka.on','biblioteka.tok','biblioteka.email'].forEach(k=>localStorage.removeItem(k));
  setG('Zaloguj przez Google');setSt('Wylogowano (lista zostaje na tym urządzeniu)');
}
function openPanel(){
  const inn=!!tok||!!localStorage.getItem('biblioteka.on'),em=localStorage.getItem('biblioteka.email');
  $('gbody').innerHTML=inn
   ?`<p>Zalogowano jako<br><b>${esc(em||'konto Google')}</b></p><p class="count">${esc($('st').textContent||'')}</p><button data-a="sync" class="pri">Synchronizuj teraz</button><button data-a="switch">Przełącz konto</button><button data-a="out">Wyloguj</button>`
   :`<p>Zaloguj się, aby synchronizować listę między urządzeniami.</p><button data-a="in" class="pri">Zaloguj przez Google</button>`;
  $('gdlg').showModal();
}
$('gdlg').addEventListener('click',e=>{
  const a=e.target.dataset&&e.target.dataset.a;if(e.target===$('gdlg')||e.target.id==='gclose'){$('gdlg').close();return}
  if(!a)return;$('gdlg').close();
  if(a==='sync')tok?sync():login();
  else if(a==='in')login();
  else if(a==='switch')switchAccount();
  else if(a==='out')logout();
});
async function api(url,o={}){const r=await fetch(url,{...o,headers:{Authorization:'Bearer '+tok,...(o.headers||{})}});if(!r.ok)throw new Error(r.status);return r}
async function sync(){
  if(!tok||Date.now()>tokExp){if(isNative()&&localStorage.getItem('biblioteka.on')){tok=null;nativeLogin();return}if(localStorage.getItem('biblioteka.on')){setSt('Sesja wygasła — kliknij „Zaloguj”');setG('☁ Zaloguj przez Google')}return}
  try{
    setSt('Synchronizuję…');
    const q=encodeURIComponent("name='"+FN+"'");
    const l=await(await api('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id)&q='+q)).json();
    fileId=l.files[0]&&l.files[0].id;
    if(fileId){const rem=await(await api('https://www.googleapis.com/drive/v3/files/'+fileId+'?alt=media')).json();merge(rem)}
    saveLocal();render();
    const body=JSON.stringify(books);
    if(fileId)await api('https://www.googleapis.com/upload/drive/v3/files/'+fileId+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body});
    else{const bd='b'+Date.now();
      await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},
      body:['--'+bd,'Content-Type: application/json','',JSON.stringify({name:FN,parents:['appDataFolder']}),'--'+bd,'Content-Type: application/json','',body,'--'+bd+'--',''].join(String.fromCharCode(13,10))})}
    setSt('Zsynchronizowano '+new Date().toLocaleTimeString('pl-PL'));
  }catch(e){setSt('Błąd synchronizacji ('+e.message+')')}
}
$('gbtn').onclick=openPanel;
if(localStorage.getItem('biblioteka.on')){
  if(isNative())nativeLogin();else{
  try{const o=JSON.parse(localStorage.getItem('biblioteka.tok'));if(o&&o.e>Date.now()){tok=o.t;tokExp=o.e}}catch(e){}
  if(tok){setG('☁ Zsynchronizuj teraz');sync()}
  else{setG('☁ Zaloguj ponownie');setSt('Kliknij gdziekolwiek, aby wznowić synchronizację');
    document.addEventListener('pointerdown',e=>{if(!tok&&!e.target.closest('#gbtn'))login()},{once:true})}
}}
render();
</script>
</body>
</html>
